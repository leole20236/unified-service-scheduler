spring:
  application:
    name: unified-service-scheduler
  threads:
    virtual:
      enabled: true

app:
  datasource:
    primary:
      url: jdbc:postgresql://localhost:5432/scheduler
      username: scheduler
      password: scheduler
    replica:
      url: jdbc:postgresql://localhost:5433/scheduler
      username: scheduler
      password: scheduler

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
